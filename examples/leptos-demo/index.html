<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>armature demo</title>
    <link data-trunk rel="rust" />
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; margin: 2rem; }
      [role="listbox"] { width: 16rem; border: 1px solid #bbb; border-radius: 6px; padding: 4px; }
      [role="option"] { padding: 6px 8px; border-radius: 4px; cursor: default; outline: none; }
      [role="option"][data-active] { background: #e8eefc; }
      [role="option"]:focus-visible { box-shadow: 0 0 0 2px #3b6fe0; }
      [role="option"][aria-selected="true"] { font-weight: 600; }
      [role="option"][aria-selected="true"]::after { content: " ✓"; }
      [role="option"][aria-disabled="true"] { color: #999; }
      [role="tablist"] { display: flex; gap: 4px; border-bottom: 1px solid #bbb; width: 24rem; }
      [role="tab"] { padding: 6px 12px; cursor: default; outline: none; border-bottom: 2px solid transparent; }
      [role="tab"][aria-selected="true"] { border-bottom-color: #3b6fe0; font-weight: 600; }
      [role="tab"]:focus-visible { box-shadow: 0 0 0 2px #3b6fe0; }
      [role="tab"][aria-disabled="true"] { color: #999; }
      [role="combobox"] { display: inline-block; width: 12rem; padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px; cursor: default; }
      [role="combobox"]:focus-visible { outline: 2px solid #3b6fe0; }
      [role="combobox"] + [role="listbox"] { background: white; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15); width: 12rem; }
      [role="tabpanel"] { display: flex; flex-direction: column; }
      main { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: 1.5rem; }
      section h3 { margin: 0 0 .5rem; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #667; }
      [data-armature-part="Track"] { position: relative; width: 14rem; height: 6px; margin: 12px 0; background: #dde; border-radius: 3px; }
      .fill { position: absolute; inset: 0 auto 0 0; background: #3b6fe0; border-radius: 3px; }
      .thumb-slot { position: absolute; top: 50%; }
      [role="slider"] { width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: white; border: 2px solid #3b6fe0; outline: none; }
      [role="slider"]:focus-visible { box-shadow: 0 0 0 3px #b8ccf6; }
      [role="switch"] { display: inline-block; width: 40px; height: 22px; border-radius: 11px; background: #ccd; vertical-align: middle; outline: none; cursor: default; }
      [role="switch"][aria-checked="true"] { background: #3b6fe0; }
      [role="switch"]:focus-visible { box-shadow: 0 0 0 3px #b8ccf6; }
      .knob { display: block; width: 18px; height: 18px; margin: 2px; border-radius: 50%; background: white; transition: transform .1s; }
      [aria-checked="true"] > .knob { transform: translateX(18px); }
      [role="button"][aria-expanded] { padding: 6px 8px; border-bottom: 1px solid #ccd; cursor: default; outline: none; width: 14rem; }
      [role="button"][aria-expanded]:focus-visible { background: #e8eefc; }
      [role="region"] { padding: 6px 8px; width: 14rem; color: #445; }
      [role="radiogroup"] { display: flex; }
      [role="radio"] { font-size: 22px; color: #ccd; cursor: default; outline: none; padding: 0 2px; }
      [role="radio"][data-active] { color: #e0a23b; }
      [role="radio"]:focus-visible { box-shadow: 0 0 0 2px #3b6fe0; border-radius: 4px; }
      [role="treeitem"] { padding: 3px 6px; cursor: default; outline: none; border-radius: 4px; }
      [role="treeitem"][aria-level="2"] { margin-left: 1.2rem; }
      [role="treeitem"][aria-level="3"] { margin-left: 2.4rem; }
      [role="treeitem"][aria-expanded="false"]::before { content: "▸ "; }
      [role="treeitem"][aria-expanded="true"]::before { content: "▾ "; }
      [role="treeitem"][aria-selected="true"] { font-weight: 600; }
      [role="treeitem"]:focus-visible { box-shadow: 0 0 0 2px #3b6fe0; }
      input { font: inherit; padding: 5px 8px; border: 1px solid #bbb; border-radius: 6px; width: 12rem; }
      .stepper { display: flex; gap: 4px; align-items: center; }
      .stepper input { width: 4rem; text-align: center; }
      .stepper [role="button"] { width: 28px; height: 28px; line-height: 28px; text-align: center; border: 1px solid #bbb; border-radius: 6px; cursor: default; user-select: none; }
      .stepper [aria-disabled="true"] { color: #bbb; }
      [role="listitem"] { padding: 6px 8px; margin: 2px 0; width: 12rem; border: 1px solid #ccd; border-radius: 6px; background: white; cursor: grab; outline: none; user-select: none; }
      [role="listitem"]:focus-visible { box-shadow: 0 0 0 2px #3b6fe0; }
      [role="listitem"][aria-selected="true"] { background: #e8eefc; border-style: dashed; }
      [data-armature-part="Backdrop"] { position: fixed; inset: 0; background: rgba(20, 24, 40, 0.35); }
      [role="dialog"] { position: fixed; top: 30%; left: 50%; transform: translateX(-50%); width: 18rem; padding: 1rem; background: white; border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25); outline: none; }
      [role="dialog"] [role="button"], [role="button"][aria-expanded][data-armature-part="Trigger"] { display: inline-block; width: auto; padding: 5px 10px; border: 1px solid #bbb; border-radius: 6px; cursor: default; }
      .calendar-head { display: flex; gap: 8px; align-items: center; width: 14rem; justify-content: space-between; }
      .calendar-head [role="button"] { padding: 2px 8px; border: 1px solid #bbb; border-radius: 6px; cursor: default; outline: none; }
      .calendar-head [role="button"]:focus-visible { box-shadow: 0 0 0 2px #3b6fe0; }
      [role="grid"] { display: grid; grid-template-columns: repeat(7, 2rem); gap: 2px; margin-top: 6px; }
      [role="gridcell"] { height: 2rem; line-height: 2rem; text-align: center; border-radius: 6px; cursor: default; outline: none; color: #aab; }
      [role="gridcell"][data-active] { color: inherit; }
      [role="gridcell"][aria-selected="true"] { background: #3b6fe0; color: white; }
      [role="gridcell"]:focus-visible { box-shadow: 0 0 0 2px #3b6fe0; }
      [role="gridcell"][aria-disabled="true"] { text-decoration: line-through; }
      [role="toolbar"] { display: flex; gap: 4px; }
      [role="toolbar"] [role="button"] { padding: 4px 10px; border: 1px solid #bbb; border-radius: 6px; cursor: default; outline: none; }
      [role="toolbar"] [role="button"]:focus-visible { box-shadow: 0 0 0 2px #3b6fe0; }
      [role="toolbar"] [aria-disabled="true"] { color: #bbb; }
      .otp { position: relative; width: 9.5rem; height: 2.4rem; }
      .otp input { position: absolute; inset: 0; width: 100%; opacity: 0; }
      .otp-cells { display: flex; gap: 6px; pointer-events: none; }
      .otp-cells span { width: 2rem; height: 2.2rem; line-height: 2.2rem; text-align: center; border: 1px solid #bbb; border-radius: 6px; font-size: 18px; }
      .otp:focus-within .otp-cells span { border-color: #3b6fe0; }
      [role="group"] { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; width: 16rem; padding: 4px; border: 1px solid #bbb; border-radius: 6px; }
      [role="group"] input { border: none; outline: none; width: 6rem; padding: 3px; }
      [role="group"] [role="button"] { padding: 2px 8px; background: #e8eefc; border-radius: 10px; cursor: default; }
      [data-armature-part="Root"]:has(> .panel) { display: flex; width: 16rem; height: 5rem; border: 1px solid #bbb; border-radius: 6px; overflow: hidden; }
      .panel { padding: 6px; box-sizing: border-box; overflow: hidden; }
      .panel.grow { flex: 1; }
      [role="separator"] { width: 6px; background: #ccd; cursor: col-resize; outline: none; flex: none; }
      [role="separator"]:focus-visible, [role="separator"][data-active] { background: #3b6fe0; }
    </style>
  </head>
  <body></body>
</html>
